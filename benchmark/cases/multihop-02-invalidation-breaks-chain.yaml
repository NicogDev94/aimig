id: multihop-02-invalidation-breaks-chain
category: multi-hop
validation_scope: reasoning_mechanics_only
clinical_validity: unvalidated
description: >
  The same chain broken by invalidation rather than supersession, with a second
  medication so that the aggregate survives at a lower level instead of
  collapsing. Tests that a multi-hop retraction leaves the untouched
  contributions structurally intact.

facts:
  - {id: med-spiro, kind: medication, concept: spironolactone, observed_at: '2024-01-10'}
  - {id: med-ramipril, kind: medication, concept: ramipril, observed_at: '2024-01-10'}
  - {id: obs-k-58, kind: observation, concept: potassium, value: {num: 5.8, unit: mmol/L}, observed_at: '2024-03-01'}
  - {id: obs-egfr-28, kind: observation, concept: egfr, value: {num: 28, unit: mL/min}, observed_at: '2024-03-01'}

expect_initial:
  attributes:
    hyperkalemia_concern: {level: HIGH, score: 10}
  recommendation: {key: medication_review, urgency: HIGH}

correction:
  intent: the eGFR belongs to a different patient
  mutations:
    - op: invalidate_fact
      fact_id: obs-egfr-28
      reason: filed against the wrong patient

expect_after_state:
  absent_conclusions: [renal_impairment, contribution:hyperkalemia:renal_impairment]
  attributes:
    hyperkalemia_concern: {level: MODERATE, score: 7}
  recommendation: {key: medication_review, urgency: MODERATE}
  identical_node_ids:
    - hyperkalemia
    - contribution:hyperkalemia:spironolactone
    - contribution:hyperkalemia:ramipril
  affected_by:
    fact_id: obs-egfr-28
    must_include: [renal_impairment, hyperkalemia_concern, action:medication_review]
    must_exclude: [contribution:hyperkalemia:ramipril]

expect_after_diff:
  retracted: [renal_impairment, contribution:hyperkalemia:renal_impairment]
  unchanged:
    - hyperkalemia
    - contribution:hyperkalemia:spironolactone
    - contribution:hyperkalemia:ramipril
  changed:
    - {key: hyperkalemia_concern, from: {level: HIGH}, to: {level: MODERATE}, verdict: weakened}
    - {key: action:medication_review, from: {urgency: HIGH}, to: {urgency: MODERATE}, verdict: weakened}
  why_changed_must_cite:
    target: hyperkalemia_concern
    verdict: weakened
    facts: [obs-egfr-28]
    rules: [threshold.egfr]
