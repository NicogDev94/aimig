id: no-change-03-supersede-inert-fact
category: no-change
validation_scope: reasoning_mechanics_only
clinical_validity: unvalidated
description: >
  The same property on the supersession path rather than the add path. An
  observation that feeds no derivation can be superseded without disturbing a
  single conclusion.

facts:
  - {id: med-spiro, kind: medication, concept: spironolactone, observed_at: '2024-01-10'}
  - {id: obs-k-58, kind: observation, concept: potassium, value: {num: 5.8, unit: mmol/L}, observed_at: '2024-03-01'}
  - {id: obs-weight-80, kind: observation, concept: weight, value: {num: 80, unit: kg}, observed_at: '2024-02-01'}

expect_initial:
  attributes:
    hyperkalemia_concern: {level: MODERATE, score: 5}

correction:
  intent: the February weight was recorded in pounds; the correct value is 78 kg
  mutations:
    - op: add_fact
      fact:
        id: obs-weight-78
        kind: observation
        concept: weight
        value: {num: 78, unit: kg}
        observed_at: '2024-02-01'
    - op: supersede_fact
      fact_id: obs-weight-80
      by: obs-weight-78
      reason: unit error on the original entry

expect_after_state:
  absent_facts_from_state: [obs-weight-80]
  fact_status: {obs-weight-80: superseded}
  attributes:
    hyperkalemia_concern: {level: MODERATE, score: 5}
  identical_node_ids: [hyperkalemia, hyperkalemia_concern, action:medication_review]
  affected_by:
    fact_id: obs-weight-80
    must_exclude: [hyperkalemia, hyperkalemia_concern, action:medication_review]

expect_after_diff:
  added: []
  retracted: []
  changed: []
  unchanged: [hyperkalemia, hyperkalemia_concern, action:medication_review]
  why_changed_must_not_cite:
    target: hyperkalemia_concern
    facts: [obs-weight-80, obs-weight-78]
