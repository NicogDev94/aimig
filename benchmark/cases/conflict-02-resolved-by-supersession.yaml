id: conflict-02-resolved-by-supersession
category: conflict
validation_scope: reasoning_mechanics_only
clinical_validity: unvalidated
description: >
  The same conflict, resolved by a human decision: the low result came from a
  haemolysed sample and is superseded by the repeat. The Conflict disappears
  because one of its premises left the active set — never because the engine
  picked a winner. The conclusion drawn from the surviving value is untouched.

facts:
  - {id: med-spiro, kind: medication, concept: spironolactone, observed_at: '2024-01-10'}
  - {id: obs-k-58, kind: observation, concept: potassium, value: {num: 5.8, unit: mmol/L}, observed_at: '2024-03-01'}
  - {id: obs-k-41, kind: observation, concept: potassium, value: {num: 4.1, unit: mmol/L}, observed_at: '2024-03-01'}

expect_initial:
  conflicts: [conflict:potassium]
  attributes:
    hyperkalemia_concern: {level: MODERATE, score: 5}
  recommendation: {key: medication_review, urgency: MODERATE}

correction:
  intent: the 4.1 result came from a haemolysed sample; the repeat is reliable
  mutations:
    - op: supersede_fact
      fact_id: obs-k-41
      by: obs-k-58
      reason: haemolysed sample, superseded by the repeat draw

expect_after_state:
  conflicts: []
  absent_facts_from_state: [obs-k-41]
  fact_status: {obs-k-41: superseded, obs-k-58: active}
  attributes:
    hyperkalemia_concern: {level: MODERATE, score: 5}
  recommendation: {key: medication_review, urgency: MODERATE}
  identical_node_ids: [hyperkalemia, hyperkalemia_concern, action:medication_review]

expect_after_diff:
  retracted: [conflict:potassium]
  added: []
  changed: []
  unchanged: [hyperkalemia, hyperkalemia_concern, action:medication_review]
  why_changed_must_cite:
    target: hyperkalemia_concern
    verdict: unchanged
