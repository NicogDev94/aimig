id: conflict-03-resolved-by-invalidation
category: conflict
validation_scope: reasoning_mechanics_only
clinical_validity: unvalidated
description: >
  The same conflict, resolved the other way: the high result is invalidated as
  a laboratory error. This time the surviving value supports no threshold, so
  the whole hyperkalemia branch retracts and the recommendation changes key,
  not merely urgency.

facts:
  - {id: med-spiro, kind: medication, concept: spironolactone, observed_at: '2024-01-10'}
  - {id: obs-k-58, kind: observation, concept: potassium, value: {num: 5.8, unit: mmol/L}, observed_at: '2024-03-01'}
  - {id: obs-k-41, kind: observation, concept: potassium, value: {num: 4.1, unit: mmol/L}, observed_at: '2024-03-01'}

expect_initial:
  conflicts: [conflict:potassium]
  recommendation: {key: medication_review, urgency: MODERATE}

correction:
  intent: the 5.8 result was reported against the wrong sample
  mutations:
    - op: invalidate_fact
      fact_id: obs-k-58
      reason: laboratory error, result reported against the wrong sample

expect_after_state:
  conflicts: []
  absent_conclusions: [hyperkalemia]
  absent_facts_from_state: [obs-k-58]
  fact_status: {obs-k-58: invalidated}
  attributes:
    hyperkalemia_concern: {level: LOW, score: 3}
  recommendation: {key: monitor_potassium, urgency: LOW}

expect_after_diff:
  retracted: [conflict:potassium, hyperkalemia, action:medication_review]
  added: [action:monitor_potassium]
  changed:
    - {key: hyperkalemia_concern, from: {level: MODERATE}, to: {level: LOW}, verdict: weakened}
  why_changed_must_cite:
    target: hyperkalemia_concern
    verdict: weakened
    facts: [obs-k-58]
    rules: [threshold.potassium]
