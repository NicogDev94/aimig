id: conflict-01-two-potassium-values
category: conflict
validation_scope: reasoning_mechanics_only
clinical_validity: unvalidated
description: >
  Two active potassium results from the same day disagree well beyond
  analytical variation. The engine surfaces a Conflict and does NOT arbitrate:
  it cannot know which is wrong, so both keep contributing and the conflict
  stays visible until a human supersedes or invalidates one. Suppressing the
  downstream reasoning would be a silent arbitration.

facts:
  - {id: med-spiro, kind: medication, concept: spironolactone, observed_at: '2024-01-10'}
  - {id: obs-k-58, kind: observation, concept: potassium, value: {num: 5.8, unit: mmol/L}, observed_at: '2024-03-01'}
  - {id: obs-k-41, kind: observation, concept: potassium, value: {num: 4.1, unit: mmol/L}, observed_at: '2024-03-01'}

expect_initial:
  active_conclusions:
    - conflict:potassium
    - hyperkalemia
    - hyperkalemia_concern
    - action:medication_review
  attributes:
    hyperkalemia: {severity: moderate}
    hyperkalemia_concern: {level: MODERATE, score: 5}
  recommendation: {key: medication_review, urgency: MODERATE}
  conflicts: [conflict:potassium]
  questions: []
