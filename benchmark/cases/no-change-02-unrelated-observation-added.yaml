id: no-change-02-unrelated-observation-added
category: no-change
validation_scope: reasoning_mechanics_only
clinical_validity: unvalidated
description: >
  Adding an observation that no rule consumes must produce a strictly empty
  reasoning diff. A system that reshuffles its conclusions whenever any datum
  arrives cannot be trusted when it says something changed.

facts:
  - {id: med-spiro, kind: medication, concept: spironolactone, observed_at: '2024-01-10'}
  - {id: obs-k-58, kind: observation, concept: potassium, value: {num: 5.8, unit: mmol/L}, observed_at: '2024-03-01'}

expect_initial:
  attributes:
    hyperkalemia_concern: {level: MODERATE, score: 5}
  recommendation: {key: medication_review, urgency: MODERATE}

correction:
  intent: record today's weight
  mutations:
    - op: add_fact
      fact:
        id: obs-weight-80
        kind: observation
        concept: weight
        value: {num: 80, unit: kg}
        observed_at: '2024-03-02'

expect_after_state:
  attributes:
    hyperkalemia_concern: {level: MODERATE, score: 5}
  recommendation: {key: medication_review, urgency: MODERATE}
  identical_node_ids: [hyperkalemia, hyperkalemia_concern, action:medication_review]

expect_after_diff:
  added: []
  retracted: []
  changed: []
  unchanged: [hyperkalemia, hyperkalemia_concern, action:medication_review]
  why_changed_must_not_cite:
    target: hyperkalemia_concern
    facts: [obs-weight-80]
