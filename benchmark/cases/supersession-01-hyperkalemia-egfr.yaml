id: supersession-01-hyperkalemia-egfr
category: supersession
validation_scope: reasoning_mechanics_only
clinical_validity: unvalidated
description: >
  THE CANONICAL CASE of Milestone 0. An eGFR of 28 from a resolved acute
  episode is superseded by the latest reliable value of 55. The renal branch
  weakens rather than disappearing, the aggregate falls one level, and the
  recommendation keeps its key while its urgency drops. The hyperkalemia claim
  is untouched because it never depended on renal function.

facts:
  - {id: med-spiro, kind: medication, concept: spironolactone, observed_at: '2024-01-10'}
  - {id: obs-k-58, kind: observation, concept: potassium, value: {num: 5.8, unit: mmol/L}, observed_at: '2024-03-01'}
  - {id: obs-egfr-28, kind: observation, concept: egfr, value: {num: 28, unit: mL/min}, observed_at: '2023-06-14'}

expect_initial:
  active_conclusions:
    - hyperkalemia
    - renal_impairment
    - contribution:hyperkalemia:spironolactone
    - contribution:hyperkalemia:renal_impairment
    - hyperkalemia_concern
    - action:medication_review
  attributes:
    hyperkalemia: {severity: moderate}
    renal_impairment: {severity: severe}
    hyperkalemia_concern: {level: HIGH, score: 8}
  recommendation: {key: medication_review, urgency: HIGH}
  conflicts: []
  questions: []

correction:
  intent: eGFR 28 came from a resolved acute episode; the latest reliable value is 55
  mutations:
    - op: add_fact
      fact:
        id: obs-egfr-55
        kind: observation
        concept: egfr
        value: {num: 55, unit: mL/min}
        observed_at: '2024-02-20'
    - op: supersede_fact
      fact_id: obs-egfr-28
      by: obs-egfr-55
      reason: value came from a resolved acute episode

expect_after_state:
  absent_facts_from_state: [obs-egfr-28]
  fact_status: {obs-egfr-28: superseded, obs-egfr-55: active}
  attributes:
    renal_impairment: {severity: moderate}
    hyperkalemia_concern: {level: MODERATE, score: 7}
  recommendation: {key: medication_review, urgency: MODERATE}
  identical_node_ids: [hyperkalemia, contribution:hyperkalemia:spironolactone]
  affected_by:
    fact_id: obs-egfr-28
    must_include:
      - renal_impairment
      - contribution:hyperkalemia:renal_impairment
      - hyperkalemia_concern
      - action:medication_review
    must_exclude: [hyperkalemia, contribution:hyperkalemia:spironolactone]

expect_after_diff:
  unchanged: [hyperkalemia, contribution:hyperkalemia:spironolactone]
  retracted: []
  added: []
  changed:
    - {key: renal_impairment, from: {severity: severe}, to: {severity: moderate}, verdict: weakened}
    - {key: contribution:hyperkalemia:renal_impairment, from: {weight: 3}, to: {weight: 2}, verdict: weakened}
    - {key: hyperkalemia_concern, from: {level: HIGH}, to: {level: MODERATE}, verdict: weakened}
    - {key: action:medication_review, from: {urgency: HIGH}, to: {urgency: MODERATE}, verdict: weakened}
  why_changed_must_cite:
    target: hyperkalemia_concern
    verdict: weakened
    facts: [obs-egfr-28, obs-egfr-55]
    rules: [threshold.egfr]
    knowledge: [ka-renal-hyperk]
    evidence: [ev-syn-04, ev-syn-06]
